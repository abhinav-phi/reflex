name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: reflex_dev_pg
          POSTGRES_DB: reflex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_ADMIN: postgresql+psycopg://postgres:reflex_dev_pg@localhost:5432/reflex
      DATABASE_URL: postgresql+psycopg://reflex_agent:R3flex_Agent_Pw_9x!2_Secure2026@localhost:5432/reflex
      DATABASE_URL_EVAL: postgresql+psycopg://reflex_eval:R3flex_Eval_Pw_7y!4_Secure2026@localhost:5432/reflex
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-not-a-real-secret
      REFLEX_AGENT_PW: R3flex_Agent_Pw_9x!2_Secure2026
      REFLEX_EVAL_PW: R3flex_Eval_Pw_7y!4_Secure2026
      REFLEX_ADMIN_PW: R3flex_Admin_Pw_8z!5_Secure2026
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tag provenance checks need history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check packages apps tests scripts
      - name: Migrate + seed
        run: |
          python -m alembic upgrade head
          python -m reflex.eval.seed
      - name: Tests (unit, api, integration, security, ai-structural, load)
        run: pytest tests -m "not e2e and not ai_live"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
