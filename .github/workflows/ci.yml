name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: reflex_dev_pg
          POSTGRES_DB: reflex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_ADMIN: postgresql+psycopg://postgres:reflex_dev_pg@localhost:5432/reflex
      DATABASE_URL: postgresql+psycopg://reflex_agent:agent_dev_pw@localhost:5432/reflex
      DATABASE_URL_EVAL: postgresql+psycopg://reflex_eval:eval_dev_pw@localhost:5432/reflex
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tag provenance checks need history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check packages apps tests scripts
      - name: Debug DB
        run: |
          python -c "from reflex.core.settings import get_settings; s=get_settings(); print('ADMIN', s.database_url_admin[:60]); print('URL', s.database_url[:60]); print('EVAL', s.database_url_eval[:60])"
          python -c "import socket; print(socket.getaddrinfo('localhost',5432))"
          PGPASSWORD=reflex_dev_pg psql -h localhost -U postgres -d reflex -c "SELECT 1" || echo "psql failed"
      - name: Migrate + seed
        run: |
          set -x
          python -m alembic upgrade head -v
          echo "alembic done code $?"
          python -c "from sqlalchemy import create_engine, text; from reflex.core.settings import get_settings; e=create_engine(get_settings().database_url_admin); print('check users', list(e.execute(text(\"SELECT to_regclass('runtime.users')\"))))"
          python -m reflex.eval.seed -v || python -m reflex.eval.seed
          echo "seed done code $?"
      - name: Tests (unit, api, integration, security, ai-structural, load)
        run: pytest tests -m "not e2e and not ai_live"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
